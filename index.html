<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歌曲播放</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f7f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            width: 80%;
            max-width: 320px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 18px;
        }
        audio {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎵 正在播放：乌龙茶3.0</h2>
        <audio controls autoplay preload="auto">
            <source src="乌龙茶3.0.mp3" type="audio/mpeg">
            您的浏览器不支持音频播放。
        </audio>
    </div>
</body>
</html>
